name: Upstream Sync

permissions:
  contents: write
  issues: write
  actions: write

on:
  schedule:
    - cron: '0 * * * *' # every hour
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史，避免浅克隆导致同步失败

      - name: Clean issue notice
        run: |
          gh issue list --label "🚨 Sync Fail" --state open --json number -q '.[].number' | xargs -r -n1 gh issue close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: macronut/phantomsocks
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatically generated, no need to set
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          # 仓库可能禁用了 Issues，创建失败不应影响工作流状态
          gh issue create --title "🚨 同步失败 | Sync Fail" --label "🚨 Sync Fail" --body "宗旨就是同步失败，看看怎么回事吧。" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
